# =============================================================================
# FACT Immobilier - configuration de l'API
# Toute valeur se surcharge par une variable d'environnement : FACT_DB_URL,
# FACT_DB_UTILISATEUR, FACT_DB_MOT_DE_PASSE, FACT_JWT_SECRET, SERVER_PORT...
# Profils :
#   - demo : application-demo.properties, donnees de demonstration fictives.
# =============================================================================

# Application
spring.application.name=fact-immobilier

# SECRETS : le fichier .env a la racine du projet (jamais commite), lu comme un fichier de proprietes.
# Deux chemins : lancement depuis la racine (./.env) ou depuis backend/ (../.env, cas de demarrer.bat).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
app.version=[app.version]
app.git.sha1=[app.git.sha1]

# Serveur (ignore sous Tomcat : c'est alors le port de Tomcat qui compte)
server.port=${SERVER_PORT:8791}
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json,text/css,text/javascript,application/javascript,text/html,text/plain,text/csv,image/svg+xml
server.compression.min-response-size=2048
server.error.include-message=always

# Encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# DATABASE
spring.datasource.url=${FACT_DB_URL:jdbc:postgresql://localhost:5432/fact_immobilier}
spring.datasource.username=${FACT_DB_UTILISATEUR:fact_immobilier}
spring.datasource.password=${FACT_DB_MOT_DE_PASSE:fact_immobilier}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=fact-immobilier

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway/schema,classpath:flyway/demo
spring.flyway.out-of-order=true
# Les scripts de demonstration (flyway/demo) deja joues ne bloquent pas le demarrage
# une fois leurs donnees purgees et le profil demo retire.
spring.flyway.ignore-migration-patterns=*:missing,*:future

# Photos : jusqu'a 12 Mo par fichier, 40 Mo par envoi (reduites ensuite a 4 096 pixels).
# Les demandes de devis du site acceptent des pieces jointes (10 Mo au total, SFD 3.5).
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=40MB

# JSON
spring.jackson.default-property-inclusion=always
spring.mvc.format.date=iso

# SECURITY
# A remplacer en production : au moins 32 caracteres (variable FACT_JWT_SECRET).
fact.jwt.secret=${FACT_JWT_SECRET:changez-moi-cle-secrete-fact-immobilier-abidjan-2026}
fact.jwt.duree-heures=12

# Compte de depart (« admin », cree au premier demarrage s'il n'existe aucun compte)
# Vide : il recoit un mot de passe provisoire aleatoire, ecrit dans le fichier ci-dessous,
# a remettre a l'administrateur puis a detruire. A changer a la premiere connexion.
fact.comptes.mot-de-passe-initial=${FACT_MOT_DE_PASSE_INITIAL:}
fact.comptes.fichier-provisoires=${FACT_FICHIER_PROVISOIRES:comptes_provisoires.txt}

# Application frontend : origines autorisees par le CORS (separees par des virgules)
fact.cors.origines=${FACT_CORS:http://localhost:4201}

# Cadrage de depart de la carte : Abidjan vu en entier (SFD 4.1)
fact.carte.latitude=5.3450
fact.carte.longitude=-4.0120
fact.carte.zoom=12

# Dossier racine de stockage des fichiers (hors de l'application, a sauvegarder avec la base).
file.upload.base-dir=${FACT_DOSSIER_FICHIERS:${user.home}/fact-immobilier/uploads}
file.upload.photo-dir=photos

# ASSISTANT (agent IA) : vide = l'assistant repond qu'il n'est pas configure, sans appeler OpenAI.
fact.assistant.cle-api=${OPENAI_API_KEY:}
fact.assistant.modele=${OPENAI_MODEL:}
# Budget de tokens par compte et par jour : au-dela, l'assistant s'arrete et l'explique.
fact.assistant.tokens-par-jour=${ASSISTANT_TOKENS_JOUR:100000}

# Journalisation
logging.level.org.flywaydb=INFO
logging.level.com.eburtis.fact=INFO

# Adresse publique du site (liens envoyés aux visiteurs : fiche d'un bien, désabonnement).
fact.site.url=${FACT_SITE_URL:http://localhost:4320}
