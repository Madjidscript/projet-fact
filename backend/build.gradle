plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.eburtis'
version = '1.0.0'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

ext {
	flywaydbVersion = '9.22.3'
	jjwtVersion = '0.11.5'
	postgresqlVersion = '42.6.1'
	poiVersion = '5.2.5'
	openpdfVersion = '1.3.43'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

	// Base PostgreSQL / PostGIS, migrations Flyway
	implementation "org.flywaydb:flyway-core:$flywaydbVersion"
	runtimeOnly "org.postgresql:postgresql:$postgresqlVersion"

	// Jetons de session
	implementation "io.jsonwebtoken:jjwt-api:$jjwtVersion"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:$jjwtVersion"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:$jjwtVersion"

	// Import et export Excel du patrimoine (SIG-10)
	implementation "org.apache.poi:poi-ooxml:$poiVersion"

	// Quittances de loyer en PDF
	implementation "com.github.librepdf:openpdf:$openpdfVersion"

	// Tomcat embarque pour java -jar, fourni par le serveur une fois le .war deploye
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Profil Spring inscrit dans le .war : gradlew bootWar -Pprofil=preprod.
// Sans -Pprofil, aucun profil n'est active.
def profilSpring = (project.findProperty('profil') ?: '').toString().trim()

// Rejoue la copie des ressources quand le profil change, pour qu'un build sans profil
// ne reprenne jamais celui d'un build de preproduction precedent.
processResources {
	inputs.property('profilSpring', profilSpring)
	// Le guide d'utilisation est aussi lu par l'assistant IA (outil consulter_guide) : il part dans le jar.
	from('../docs') {
		include 'guide-utilisateur.md'
		into 'assistant'
	}
}

task updateAppProperties(dependsOn: processResources) {
	doLast {
		def proprietes = file("build/resources/main/application.properties")
		def sha1 = ''
		try {
			sha1 = 'git rev-parse HEAD'.execute().text.trim()
		} catch (ignored) {
		}
		ant.replace(file: proprietes, token: "[app.version]", value: version)
		ant.replace(file: proprietes, token: "[app.git.sha1]", value: sha1)
		def lignes = proprietes.readLines('UTF-8').findAll { !it.startsWith('spring.profiles.active=') }
		if (profilSpring) {
			lignes << "spring.profiles.active=${profilSpring}".toString()
		}
		proprietes.write(lignes.join('\n') + '\n', 'UTF-8')
	}
}
classes.dependsOn updateAppProperties

// L'interface Angular se compile dans src/main/resources/static (voir frontend/angular.json) :
// le jar produit par « bootJar » sert alors l'application entiere.
bootJar {
	archiveFileName = 'fact-immobilier.jar'
}
// Deploiement sous Tomcat : l'interface est servie a part.
bootWar {
	archiveFileName = 'fact-immobilier.war'
}
jar {
	enabled = false
}
war {
	enabled = false
}
